apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudstream-dashboard
  namespace: fraudstream
spec:
  replicas: 1
  selector:
    matchLabels: {app: fraudstream-dashboard}
  template:
    metadata:
      labels: {app: fraudstream-dashboard}
    spec:
      containers:
        - name: dashboard
          image: fraudstream-dashboard:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CASSANDRA_HOST
              value: cassandra-client
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /api/summary, port: 8080}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /api/summary, port: 8080}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fraudstream-dashboard
  namespace: fraudstream
spec:
  selector: {app: fraudstream-dashboard}
  ports: [{port: 8080, targetPort: 8080}]
