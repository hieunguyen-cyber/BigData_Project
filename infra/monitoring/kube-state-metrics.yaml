apiVersion: v1
kind: ServiceAccount
metadata: {name: kube-state-metrics, namespace: fraudstream}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fraudstream-kube-state-metrics}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "resourcequotas"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fraudstream-kube-state-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fraudstream-kube-state-metrics}
subjects: [{kind: ServiceAccount, name: kube-state-metrics, namespace: fraudstream}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: fraudstream}
spec:
  replicas: 1
  selector: {matchLabels: {app: kube-state-metrics}}
  template:
    metadata: {labels: {app: kube-state-metrics}}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports: [{containerPort: 8080}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: fraudstream}
spec: {selector: {app: kube-state-metrics}, ports: [{port: 8080, targetPort: 8080}]}
