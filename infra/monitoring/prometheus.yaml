apiVersion: v1
kind: ConfigMap
metadata: {name: fraudstream-prometheus, namespace: fraudstream}
data:
  prometheus.yml: |
    global: {scrape_interval: 15s}
    scrape_configs:
      - job_name: fraudstream-dashboard
        static_configs: [{targets: ["fraudstream-dashboard:8080"]}]
      - job_name: fraudstream-scoring
        static_configs: [{targets: ["fraudstream-scoring:8000"]}]
      - job_name: kube-state-metrics
        static_configs: [{targets: ["kube-state-metrics:8080"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: fraudstream}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
      volumes: [{name: config, configMap: {name: fraudstream-prometheus}}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: fraudstream}
spec: {selector: {app: prometheus}, ports: [{port: 9090, targetPort: 9090}]}
