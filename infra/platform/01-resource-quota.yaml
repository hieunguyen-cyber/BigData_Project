apiVersion: v1
kind: LimitRange
metadata:
  name: fraudstream-limits
  namespace: fraudstream
spec:
  limits:
    - default:
        memory: 1Gi
        cpu: 500m
      defaultRequest:
        memory: 256Mi
        cpu: 100m
      type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fraudstream-quota
  namespace: fraudstream
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 12Gi
    persistentvolumeclaims: "10"
