apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-batch
  namespace: fraudstream
  labels:
    app.kubernetes.io/name: spark-batch
    app.kubernetes.io/part-of: fraudstream
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-batch-role
  namespace: fraudstream
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-batch-binding
  namespace: fraudstream
subjects:
  - kind: ServiceAccount
    name: spark-batch
    namespace: fraudstream
roleRef:
  kind: Role
  name: spark-batch-role
  apiGroup: rbac.authorization.k8s.io
